name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Check compiler
        run: cc --version
      - name: Prepare private test directory
        run: |
          python3 - <<'PYTHON'
          import os
          import tempfile

          system_temp = os.path.realpath(tempfile.gettempdir())
          test_temp = tempfile.mkdtemp(prefix="wa-indexer-tests-", dir=system_temp)
          os.chmod(test_temp, 0o700)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"TMPDIR={test_temp}\n")
          PYTHON
      - name: Check CI environment
        run: python3 .github/workflows/tests/test_ci_environment.py
      - name: Check Go formatting
        run: make formatcheck
      - name: Build app
        run: make build
      - name: Vet
        run: make vet
      - name: Test
        env:
          GOFLAGS: '-p=1'
          GOMAXPROCS: '2'
        run: make test
      - name: Test browser logic
        run: make ui-test
      - name: Test developer scripts
        run: |
          python -m pip install -r services/transcription/requirements.txt
          make script-test

name: Public documentation

on:
  pull_request:
    paths: ['docs/**', '.github/workflows/docs.yml', 'README.md', 'internal/localui/assets/**', 'scripts/test-refresh-browser.mjs', 'scripts/test-transcription-setup-browser.mjs']
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs.yml', 'README.md', 'internal/localui/assets/**', 'scripts/test-refresh-browser.mjs', 'scripts/test-transcription-setup-browser.mjs']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs/.vitepress
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: docs/.vitepress/package-lock.json
      - run: npm ci
      - run: npm run check:dependencies
      - run: npm test
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Test seamless owner refresh with synthetic APIs
        working-directory: .
        run: node scripts/test-refresh-browser.mjs
      - name: Test Hebrew onboarding with synthetic APIs
        working-directory: .
        run: node scripts/test-transcription-setup-browser.mjs
      - name: Upload qualified Pages artifact
        if: github.event.repository.private == false && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.repository == 'DevShiftTeam/my-whatsapp-mcp' && github.event.repository.private == false && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: docs-pages
      cancel-in-progress: false
    steps:
      - name: Deploy qualified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
